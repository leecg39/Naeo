<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NAEO 발행 도우미</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="topbar">
    <div><strong class="brand">NAEO<span>●</span></strong><p>네이버 블로그 발행 도우미</p></div>
    <button id="open-writer" class="secondary" type="button">네이버 글쓰기 열기</button>
  </header>

  <main>
    <section id="setup" class="card">
      <p class="eyebrow">연결 설정</p>
      <h1>NAEO 계정 연결</h1>
      <label for="service-base">NAEO 서비스 주소</label>
      <input id="service-base" type="url" autocomplete="url" spellcheck="false" value="https://www.naeo.kr">
      <p class="hint">확장 ID <code id="extension-id"></code>를 서버의 <code>NAEO_EXTENSION_IDS</code>에 등록해야 합니다.</p>
      <button id="connect" class="primary" type="button">NAEO로 로그인</button>
    </section>

    <section id="drafts-view" class="hidden">
      <div class="toolbar">
        <div><p class="eyebrow">내 글</p><h1>저장한 글</h1></div>
        <button id="disconnect" class="text-button" type="button">연결 해제</button>
      </div>
      <form id="search-form" class="search">
        <label class="sr-only" for="draft-search">제목 검색</label>
        <input id="draft-search" type="search" maxlength="100" placeholder="제목 검색">
        <button class="secondary" type="submit">검색</button>
      </form>
      <button id="refresh-drafts" class="text-button" type="button">목록 새로고침</button>
      <ul id="draft-list" class="draft-list"></ul>
    </section>

    <section id="transfer-view" class="hidden">
      <button id="back-to-drafts" class="back" type="button">‹ 내 글</button>
      <h1 id="draft-title"></h1>
      <p class="hint">행을 누르면 조각을 복사하고 네이버 편집 위치를 찾습니다. 붙여넣기와 발행은 직접 해주세요.</p>
      <div class="progress"><span id="progress-text">0 / 0 적용</span><button id="reset-progress" class="text-button" type="button">진행 초기화</button></div>
      <ul id="transfer-list" class="transfer-list"></ul>
    </section>

    <p id="status" class="status" role="status" aria-live="polite" tabindex="-1"></p>
  </main>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
